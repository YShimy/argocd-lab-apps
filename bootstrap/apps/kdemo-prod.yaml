apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boot-kdemo-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/YShimy/argocd-lab-apps.git
    targetRevision: main
    path: kustomize-demo/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: boot-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
