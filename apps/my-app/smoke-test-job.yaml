apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
      - name: smoke-test
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Running smoke test...'; sleep 3; echo 'Smoke test passed.'; exit 0"]
      restartPolicy: Never
  backoffLimit: 0
